name: Daily GitHub Activity

on:
  schedule:
    # Runs at 9:30 AM IST (4:00 AM UTC) every day
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write  # ✅ FIX: This was missing — grants the bot push access

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Git configuration
        run: |
          git config --local user.email "souvikmahanta2003@gmail.com"
          git config --local user.name "Souvik Mahanta"

      - name: Create activity directories
        run: |
          mkdir -p .github/activity
          mkdir -p docs/daily-logs

      - name: Generate daily activity log
        run: |
          DATE=$(date '+%Y-%m-%d')
          TIME=$(date '+%H:%M:%S IST')

          cat > "docs/daily-logs/${DATE}.md" << EOF
          # Daily Activity Log - ${DATE}

          ## 🤖 Automated System Updates
          - Repository maintenance completed at ${TIME}
          - Dependencies and security checks performed
          - Code quality metrics reviewed

          ## 🎯 Focus Areas Today
          - AI/ML model optimization
          - Backend API enhancements
          - Security protocol reviews
          - Performance monitoring

          ## 📊 Development Stats
          - Active development session: ${TIME}
          - System status: Operational
          - Last commit analysis: Completed

          ---
          *Generated automatically by GitHub Actions*
          EOF

          echo "📄 Daily update completed - ${DATE} ${TIME}" >> .github/activity/activity-log.txt

      - name: Update profile metadata
        run: |
          echo "$(date '+%Y-%m-%d %H:%M:%S IST')" > .github/activity/last-update.txt
          sed -i "s/Last updated: .*/Last updated: $(date '+%B %Y')/" README.md

      - name: Commit and push changes
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit today"
          else
            git commit -m "🤖 Daily activity update - $(date '+%Y-%m-%d')"
            git push origin main
          fi